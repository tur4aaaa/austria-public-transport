name: Auto Release

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

jobs:
  release:
    # Only for a successful push to this repository. `branches` matches the
    # head branch name, so a fork PR from a branch called `main` would pass it.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Extract version from manifest.json
        id: version
        run: |
          version=$(jq -r '.version' custom_components/austria_public_transport/manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          notes=$(awk -v ver="${VERSION}" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/^$/N;/^\n$/d' -e 's/^[[:space:]]*//')
          echo "${notes}" > /tmp/release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build the HACS archive
        if: steps.check.outputs.exists == 'false'
        run: |
          # HACS extracts this archive straight into
          # `custom_components/austria_public_transport/`
          # (`zip_file.extractall(self.content.path.local)`), so the integration's
          # files must sit at the archive ROOT -- a top-level
          # `austria_public_transport/` directory inside the zip would land as
          # `custom_components/austria_public_transport/austria_public_transport/`.
          # Hence the `cd` and the `.` rather than zipping the path from here.
          #
          # The name must match `filename` in hacs.json exactly: HACS asks the
          # release for that one asset by name and fails the download if it is
          # absent. The HACS validation action only checks that `filename` is set,
          # never that the asset exists, so a broken step here fails silently at
          # install time and never in CI.
          cd custom_components/austria_public_transport
          zip -r -q "${GITHUB_WORKSPACE}/austria_public_transport.zip" . \
            -x '*__pycache__*' '*.pyc'
          unzip -l "${GITHUB_WORKSPACE}/austria_public_transport.zip"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          # The archive is a positional argument to the same call, so a release is
          # never published without it.
          gh release create "${TAG}" \
            --title "${TAG}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --notes-file /tmp/release-notes.md \
            austria_public_transport.zip
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
